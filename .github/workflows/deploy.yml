name: Deploy to GitHub Pages

# The toolkit moved into the Personal Finance Teaching Toolkit on the
# Resource Hub (langm-stan/ResourceHub). This site now publishes only a
# static redirect page (site/) that forwards every old URL to its new home.
# The app source remains in the repo for history but is no longer built.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 404.html is a copy of index.html so deep links like /tools/tvm,
      # which GitHub Pages serves as 404s, also redirect.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
